name: Build macOS

on:
  push:
    branches: [feat/osc-7770-action-dispatch]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        run: |
          curl -L https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz -o /tmp/zig.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-aarch64-macos-0.15.2" >> "$GITHUB_PATH"

      - name: Build Ghostty (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Package app
        run: |
          cd zig-out/bin
          zip -r "${{ github.workspace }}/Ghostty-osc7770-macos-arm64.zip" Ghostty.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-osc7770-macos-arm64
          path: Ghostty-osc7770-macos-arm64.zip
