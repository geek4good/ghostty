name: Build macOS

on:
  push:
    branches: [feat/osc-7770-action-dispatch]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        run: |
          brew install zig@0.15.2 || true
          # Fallback: download directly if brew doesn't have it
          if ! zig version 2>/dev/null | grep -q "0.15.2"; then
            curl -L https://ziglang.org/download/0.15.2/zig-macos-aarch64-0.15.2.tar.xz -o /tmp/zig.tar.xz
            tar xf /tmp/zig.tar.xz -C /tmp
            echo "/tmp/zig-macos-aarch64-0.15.2" >> "$GITHUB_PATH"
          fi

      - name: Verify Zig version
        run: zig version

      - name: Build Ghostty (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Package app
        run: |
          cd zig-out/bin
          zip -r "${{ github.workspace }}/Ghostty-osc7770-macos-arm64.zip" Ghostty.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-osc7770-macos-arm64
          path: Ghostty-osc7770-macos-arm64.zip
